name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "The following files are not gofmt'd:"
            echo "$unformatted"
            echo
            gofmt -d .
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

      - name: go.mod and go.sum are tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

  test:
    name: Test (go ${{ matrix.go }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The floor declared in go.mod, plus the current release, so a toolchain
        # change cannot silently break either the minimum supported version or the
        # latest one. forgeron is a library, so the floor is a consumer-facing
        # compatibility promise and is worth testing explicitly.
        go: ['1.25', 'stable']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache: true

      - name: Test
        run: go test ./... -count=1

      - name: Test (race detector)
        run: go test -race ./... -count=1

  flake-check:
    name: Flake check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # Both generators sample a Bayesian network, so a single pass can hide
      # low-probability assertion failures: two such tests reached master and only
      # surfaced once the bundled data shifted the sampling odds. Repeating the suite
      # makes that class of bug fail here instead of in a later data update.
      - name: Test (repeated)
        run: go test ./... -count=20
